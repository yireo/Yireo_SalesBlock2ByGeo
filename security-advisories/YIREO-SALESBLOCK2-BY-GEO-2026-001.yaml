schema_version: "1.6.0"
id: YIREO-SALESBLOCK2-BY-GEO-2026-001
published: "2026-11-25T00:00:00Z"
modified: "2026-11-26T00:00:00Z"
aliases: []
summary: Geo blocking rules can be bypassed by spoofing the X-Forwarded-For header
details: >
  Up to and including version 2.1.2 the client IP used for geo matching was determined via the Magento
  RemoteAddress class. When Magento was configured to read an alternative header like X-Forwarded-For,
  the leftmost IP of that header was used, which is fully controlled by the client. Any unauthenticated
  visitor could therefore send a fake X-Forwarded-For header with an IP from an allowed country and bypass
  all geo-based sales block rules. Versions 2.1.3 (backport for the 2.x branch) and 3.0.0 use REMOTE_ADDR
  and only walk the X-Forwarded-For chain from the right when the request comes from a proxy listed in the
  new trusted proxies setting. Users of older versions should upgrade to 2.1.3 or 3.0.0 and configure the
  trusted proxies setting when Magento runs behind a reverse proxy or load balancer.
